
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebFut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f0f0f0;
      --bg-surface: #ffffff;
      --bg-contrast: #000000;
      --text-main: #000000;
      --text-contrast: #ffffff;
      --border-main: #000000;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .brutal-shadow {
      box-shadow: 4px 4px 0px 0px var(--border-main);
    }
    .brutal-shadow-sm {
      box-shadow: 2px 2px 0px 0px var(--border-main);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input::placeholder {
      opacity: 0.3;
      color: var(--text-main);
    }
    * {
      border-color: var(--border-main);
    }
  </style>
